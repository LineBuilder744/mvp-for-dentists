{% extends 'base.html' %}
{% block content %}<section class="auth"><h1>Новый пароль</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="button" type="submit">Сохранить пароль</button></form>{% else %}<p>Ссылка недействительна или срок её действия истёк.</p><a href="{% url 'password_reset' %}">Запросить новую ссылку</a>{% endif %}</section>{% endblock %}
